name: release

on:
  push:
    tags:
      - "v*"

# contents: write lets goreleaser create the GitHub Release; packages: write
# lets GITHUB_TOKEN push the CMP image to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.0"
          check-latest: true

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF##*/}" >> "${GITHUB_OUTPUT}"

      - name: Install sops
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/getsops/sops/v3)
          go install "github.com/getsops/sops/v3/cmd/sops@${version}"

      - name: Run Tests
        env:
          CUEGEN_REQUIRE_SOPS_CLI: "1"
        run: go test ./...

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --config=.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      # Transition period: the CMP image is pushed to both Docker Hub (the
      # established registry) and GHCR (the future home). Once every consumer
      # pulls from GHCR, drop the Docker Hub login/build/push steps.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # buildx, not "docker build && docker push": with the classic builder
      # every layer uploads to GHCR but the manifest write returns "denied",
      # even for a freshly created package and with packages: write granted.
      # The same images pushed through buildx succeed (verified with a probe
      # workflow), and mcs-backup pushes this way on its v2 branch.
      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: image
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          hub=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          # GHCR image mirrors the repository name, as mcs-backup does; GHCR
          # accepts lower-case only.
          ghcr=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "tags=${hub}:${VERSION},${hub}:latest,${ghcr}:${VERSION},${ghcr}:latest" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile-cmp
          platforms: linux/amd64
          build-args: VERSION=${{ steps.get_version.outputs.VERSION }}
          tags: ${{ steps.image.outputs.tags }}
          push: true
