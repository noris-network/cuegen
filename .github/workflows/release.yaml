name: release

on:
  push:
    tags:
      - "v*"

# contents: write lets goreleaser create the GitHub Release; packages: write
# lets GITHUB_TOKEN push the CMP image to ghcr.io.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: ">=1.26.0"
          check-latest: true

      - name: Get Version
        id: get_version
        run: echo "VERSION=${GITHUB_REF##*/}" >> "${GITHUB_OUTPUT}"

      - name: Install sops
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/getsops/sops/v3)
          go install "github.com/getsops/sops/v3/cmd/sops@${version}"

      - name: Run Tests
        env:
          CUEGEN_REQUIRE_SOPS_CLI: "1"
        run: go test ./...

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --config=.goreleaser.yaml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      # Transition period: the CMP image is pushed to both Docker Hub (the
      # established registry) and GHCR (the future home). Once every consumer
      # pulls from GHCR, drop the Docker Hub login/build/push steps.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          DH_IMAGE=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          # Same scheme as mcs-backup: the GHCR package mirrors the repository
          # name. A pre-existing package under a different name (cuegen-cmp)
          # was not connected to this repo, so GITHUB_TOKEN could not write its
          # manifest ("denied") and it could not be deleted (server error 500).
          # Using the repository name creates a fresh package that GitHub links
          # to this repo, a link the org.opencontainers.image.source label in
          # docker/Dockerfile-cmp reinforces. GHCR accepts lower-case only.
          GH_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo version=$VERSION
          cat docker/Dockerfile-cmp
          docker build . \
            -t $DH_IMAGE:$VERSION -t $DH_IMAGE:latest \
            -t $GH_IMAGE:$VERSION -t $GH_IMAGE:latest \
            -f docker/Dockerfile-cmp --build-arg VERSION=$VERSION
          docker push $DH_IMAGE:$VERSION
          docker push $DH_IMAGE:latest
          docker push $GH_IMAGE:$VERSION
          docker push $GH_IMAGE:latest
