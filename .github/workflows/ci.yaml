name: ci

# The release workflow only runs on tag pushes, so until this existed nothing
# tested a branch, a pull request, or the weekly dependabot bumps - a broken
# dependency was only discovered while cutting a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # The sops CLI encrypts the fixtures for the round-trip tests in
      # cmd/cuegen/sops_test.go. Those tests skip when it is absent, which
      # would leave the suite green while silently testing nothing - hence
      # CUEGEN_REQUIRE_SOPS_CLI below, which turns the skip into a failure.
      # The version is read from go.mod so the CLI and the linked library can
      # never drift apart.
      - name: Install sops
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/getsops/sops/v3)
          echo "installing sops ${version} (from go.mod)"
          go install "github.com/getsops/sops/v3/cmd/sops@${version}"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::these files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...

      - name: go build
        run: go build ./...

      # -race catches data races the plain suite cannot; the golden-file and
      # legacy-fallback tests build and exec the binary as a subprocess, so
      # this covers the real CLI contract, not just the packages.
      - name: go test
        env:
          CUEGEN_REQUIRE_SOPS_CLI: "1"
        run: go test -race ./...

  # The CMP image was previously only ever built while cutting a release, so a
  # Dockerfile mistake surfaced as a broken release - twice in a row most
  # recently (7d43846 "Fix curfetch stage", eab6f96 "Install curl ... for yq
  # download"). Building it here moves that discovery to the pull request.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Both binaries come from published Release archives, so a branch has no
      # archive of its own to build against. The latest published tag stands in:
      # it exercises every step that actually breaks - the two fetch stages,
      # both checksum verifications, apt, and the yq install - and only leaves
      # out "the tag being released exists", which is true by construction in
      # the release workflow.
      - name: Resolve latest release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "${tag}" ]; then
            echo "::notice::no published release to build the CMP image against; skipping"
          else
            echo "building CMP image against ${tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build CMP image
        if: steps.release.outputs.tag != ''
        run: |
          docker build . \
            -f docker/Dockerfile-cmp \
            -t cuegen-cmp:ci \
            --build-arg "VERSION=${{ steps.release.outputs.tag }}"

      # A green build only proves the layers ran. These assertions prove the
      # image is actually usable as an ArgoCD sidecar: both binaries present
      # and runnable, yq executable (so its checksum gate and chmod worked),
      # the plugin manifest in place, and the discovery probe honouring its
      # contract - silent outside a module, exactly "true" inside one.
      - name: Smoke-test CMP image
        if: steps.release.outputs.tag != ''
        run: |
          set -eux
          docker run --rm cuegen-cmp:ci /bin/cuegen version
          docker run --rm cuegen-cmp:ci /bin/yq --version
          docker run --rm cuegen-cmp:ci test -x /bin/cuegen_v0.16.8
          docker run --rm cuegen-cmp:ci test -f /home/argocd/cmp-server/config/plugin.yaml

          probe=$(docker run --rm cuegen-cmp:ci /bin/cuegen -is-cuegen-dir)
          test -z "${probe}"

          probe=$(docker run --rm -w /tmp cuegen-cmp:ci \
            sh -c 'touch cuegen.cue && /bin/cuegen -is-cuegen-dir')
          test "${probe}" = "true"
